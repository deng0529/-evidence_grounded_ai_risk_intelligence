# Versioned risk-model specification. Calculators remain Python code; this file controls
# model membership, reference levels, domain membership and aggregation weights/policy.
current_model_version: "1.2"
calculation_version: "m5-calculation-v1.2"
er_model_version: "1.2"

variables:
  G1.1: {low: "0", high: "90", unit: days}
  G1.2: {low: "0", high: "30", unit: days}
  G2.1: {low: "0", high: ".50", unit: ratio}
  G2.2: {low: "5", high: "1", unit: years}
  G2.3: {low: "0", high: ".50", unit: ratio}
  G3.1: {low: "0", high: "2", unit: count}
  F1.1: {low: ".10", high: "0", unit: ratio}
  F1.2: {low: "0", high: "-.20", unit: ratio}
  F2.2: {low: "1.50", high: "1.10", unit: ratio}
  F2.3: {low: "1", high: ".70", unit: ratio}
  F3.1: {low: ".20", high: ".60", unit: ratio}

models:
  "1":
    active_variables: [G1.1, G1.2, G2.1, G2.2, G2.3, G3.1, F1.1, F1.2, F2.2, F2.3, F3.1]
  "1.1":
    active_variables: [G1.1, G1.2, G2.2, F1.1, F2.2, F2.3, F3.1]
  "1.2":
    active_variables: [G1.1, G1.2, G2.2, F1.1, F2.2, F2.3]
    domains:
      GOVERNANCE:
        weight: "0.40"
        weighting_policy: EQUAL_WEIGHT_ACTIVE_VARIABLES
        variables: [G1.1, G1.2, G2.2]
      FINANCIAL:
        weight: "0.60"
        weighting_policy: EQUAL_WEIGHT_ACTIVE_VARIABLES
        variables: [F1.1, F2.2, F2.3]
